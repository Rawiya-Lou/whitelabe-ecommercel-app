version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    target-branch: "develop"
    # Group related dependencies to reduce PR noise
    groups:
      nextjs-stack:
        patterns:
          - "next*"
          - "react*"
          - "@types/react*"
      medusajs-stack:
        patterns:
          - "@medusajs/*"