name: CD & Production Deployment

on:
  # Only deploy automatically after CI & Quality Control SUCCEEDS on main
  workflow_run:
    workflows: ["CI & Quality Control"]
    types: [completed]
    branches: [main]
  # Allow manual re-deployments from GitHub Actions UI
  workflow_dispatch:
    inputs:
      deploy_cms:
        description: "Deploy Sanity Studio (CMS)"
        type: boolean
        default: true
      deploy_backend:
        description: "Deploy Medusa Server & Worker (Render)"
        type: boolean
        default: true
      deploy_storefront:
        description: "Deploy Next.js Storefront (Vercel)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  gate:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    outputs:
      deploy_cms: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_cms || 'true' }}
      deploy_backend: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_backend || 'true' }}
      deploy_storefront: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_storefront || 'true' }}
    steps:
      - run: echo "CI gate passed for commit ${{ github.event.workflow_run.head_sha || github.sha }}"

  deploy-cms-vercel:
    name: Deploy CMS (Sanity Studio on Vercel)
    needs: gate
    if: ${{ needs.gate.outputs.deploy_cms == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel CMS Deploy Hook
        env:
          VERCEL_CMS_HOOK: ${{ secrets.VERCEL_CMS_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_CMS_HOOK" ]; then
            echo "Error: VERCEL_CMS_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 -X POST "$VERCEL_CMS_HOOK"
          echo "Vercel Sanity Studio deployment triggered."

  deploy-backend-render:
    name: Deploy Backend (Medusa Server + Worker on Render)
    needs: gate
    if: ${{ needs.gate.outputs.deploy_backend == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Server & Worker Deploy Hooks
        env:
          RENDER_SERVER_HOOK: ${{ secrets.RENDER_SERVER_DEPLOY_HOOK_URL }}
          RENDER_WORKER_HOOK: ${{ secrets.RENDER_WORKER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_SERVER_HOOK" ] || [ -z "$RENDER_WORKER_HOOK" ]; then
            echo "Error: RENDER_SERVER_DEPLOY_HOOK_URL and RENDER_WORKER_DEPLOY_HOOK_URL must both be set."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 -X POST "$RENDER_SERVER_HOOK"
          curl --fail --silent --show-error --max-time 15 -X POST "$RENDER_WORKER_HOOK"
          echo "Triggered both Render Medusa Server and Worker."

      - name: Wait for Render Medusa Server Health Check
        env:
          MEDUSA_BACKEND_URL: ${{ secrets.MEDUSA_BACKEND_URL }}
        run: |
          if [ -z "$MEDUSA_BACKEND_URL" ]; then
            echo "Error: MEDUSA_BACKEND_URL secret is not set."
            exit 1
          fi

          TIMEOUT=900
          INTERVAL=20
          ELAPSED=0
          BASE_URL=$(echo "${MEDUSA_BACKEND_URL}" | sed 's:/*$::')
          HEALTH_URL="${BASE_URL}/health"

          echo "Waiting for ${HEALTH_URL}..."
          sleep 30

          until [ "$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${HEALTH_URL}")" -eq 200 ]; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Timed out waiting for Medusa Backend after ${ELAPSED}s."
              exit 1
            fi
            echo "Backend updating... retrying in ${INTERVAL}s (${ELAPSED}/${TIMEOUT}s)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Medusa Backend is live and healthy!"

  deploy-storefront-vercel:
    name: Deploy Storefront (Next.js on Vercel)
    needs: [gate, deploy-backend-render]
    if: ${{ always() && needs.gate.outputs.deploy_storefront == 'true' && (needs.deploy-backend-render.result == 'success' || needs.deploy-backend-render.result == 'skipped') }}
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel Storefront Deploy Hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_HOOK" ]; then
            echo "Error: VERCEL_DEPLOY_HOOK_URL secret is not set."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 15 -X POST "$VERCEL_HOOK"
          echo "Vercel Storefront deployment triggered."

      - name: Verify Storefront Health Endpoint
        env:
          STOREFRONT_URL: ${{ secrets.STOREFRONT_URL }}
        run: |
          if [ -z "$STOREFRONT_URL" ]; then
            echo "STOREFRONT_URL not set; skipping post-deploy storefront health probe."
            exit 0
          fi

          TIMEOUT=480
          INTERVAL=20
          ELAPSED=0
          BASE_URL=$(echo "${STOREFRONT_URL}" | sed 's:/*$::')
          HEALTH_URL="${BASE_URL}/api/health"

          sleep 30
          until [ "$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "${HEALTH_URL}")" -eq 200 ]; do
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Warning: Storefront health probe timed out at ${HEALTH_URL}."
              exit 1
            fi
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Storefront is live and healthy!"