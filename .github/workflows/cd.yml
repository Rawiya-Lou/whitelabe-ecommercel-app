name: CD & Production Deployment

on:
  push:
    branches: [main] # Only runs when PRs are merged to main
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  CI: true
  SKIP_ENV_VALIDATION: "true"

jobs:
  deploy-cms-vercel:
    name: Trigger Vercel CMS Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel CMS Deploy Hook
        env:
          VERCEL_CMS_HOOK: ${{ secrets.VERCEL_CMS_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$VERCEL_CMS_HOOK" ]; then
            echo "Error: VERCEL_CMS_DEPLOY_HOOK_URL secret is not set inside GitHub Repository Secrets."
            exit 1
          fi
          echo "Triggering Vercel Sanity Studio CMS deployment..."
          curl -X POST -f "$VERCEL_CMS_HOOK"
          echo "Vercel Sanity Studio deployment triggered successfully."
  # 1. Run migrations directly against the DB before launching the app
  run-migrations:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      # We only need to run the migrations script via your workspace tool
      - name: Run Medusa Migrations & Seed Initialization
        working-directory: ./apps/backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
          ACTIVE_SHIPPING_PROVIDER: "manual_manual"
          STORE_WAREHOUSE_COUNTRY: "DZ"
          STORE_NAME: "Production Instance"
          STRIPE_API_KEY: "sk_test_CI_MOCK_SECRET_KEY"
          STRIPE_WEBHOOK_SECRET: "whsec_CI_MOCK_WEBHOOK_SECRET"
          CHARGILY_SECRET_KEY: "test_sk_mock_secret_key"
          CHARGILY_WEBHOOK_SECRET: "test_wh_mock_webhook_secret"
          CHARGILY_IS_TEST_MODE: "true"
          

        run: npm run build && npm run predeploy

  # 2. Trigger Render to pull, use build-backend.js, and host
  deploy-backend-render:
    name: Trigger Render Backend Deploy
    needs: run-migrations
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_HOOK" ]; then
            echo "Error: RENDER_DEPLOY_HOOK_URL secret is not set"
            exit 1
          fi
          curl -X POST -f "$RENDER_HOOK"

      - name: Wait for Render Backend to be Live & Healthy
        env:
          MEDUSA_BACKEND_URL: ${{ secrets.MEDUSA_BACKEND_URL }}
        run: |
          echo "Waiting for backend to finish deploying on Render..."
          TIMEOUT=900
          INTERVAL=20
          ELAPSED=0

          BASE_URL=$(echo "${MEDUSA_BACKEND_URL}" | sed 's:/*$::')
          HEALTH_URL="${BASE_URL}/health"

          echo "Target Health check URL: ${HEALTH_URL}"
          echo "Giving Render 30 seconds to initialize..."
          sleep 30

          until [ "$(curl -s -o /dev/null -w "%{http_code}" "${HEALTH_URL}")" -eq 200 ]; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timed out waiting for backend to become healthy after ${ELAPSED}s."
              exit 1
            fi
            
            echo "Backend container updating. Retrying in ${INTERVAL}s... (${ELAPSED}/${TIMEOUT}s elapsed)"
            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "Success: Medusa Backend is live and healthy!"

  # 3. Trigger Vercel for Next.js storefront once backend is confirmed up
  deploy-storefront-vercel:
    name: Trigger Vercel Storefront Deploy
    needs: deploy-backend-render
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Deploy Hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL}}
        run: |
          VERCEL_HOOK="${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          if [ -z "$VERCEL_HOOK" ]; then
           echo "Error: VERCEL_DEPLOY_HOOK_URL secret is not set"
           exit 1
          fi
          echo "Triggering Vercel deployment..."
          curl -X POST -f "$VERCEL_HOOK"
          echo "Vercel deployment triggered successfully"
