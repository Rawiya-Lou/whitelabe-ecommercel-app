name: CD & Production Deployment

on:
  push:
    branches: [main] # Only runs when PRs are merged to main
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: production-deployment
  cancel-in-progress: false
env:
  CI: true
  SKIP_ENV_VALIDATION: "true" # Prevents T3-Env from crashing during storefront tasks

jobs:
  deploy-backend:
    name: Deploy Medusa Backend & Run Migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Medusa application
        working-directory: ./apps/backend
        run: npx medusa build

      - name: Install production dependencies
        working-directory: ./apps/backend/.medusa/server

        run: npm install --omit=dev --legacy-peer-deps --no-audit --no-fund


      - name: Run migrations
        working-directory: ./apps/backend/.medusa/server

        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx medusa db:migrate

  # 2. Trigger Render to rebuild and deploy the Medusa backend
  deploy-backend-render:
    name: Trigger Render Backend Deploy
    needs: deploy-backend
    runs-on: ubuntu-latest
    steps:
      - name: Call Render Deploy Hook
        env:
          RENDER_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST -f "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

      - name: Wait for Render Backend to be Live & Healthy
        env:
          MEDUSA_BACKEND_URL: ${{secrets.MEDUSA_BACKEND_URL}}
        run: |
          echo "Waiting for backend to finish deploying on Render..."
          TIMEOUT=900
          INTERVAL=15
          ELAPSED=0
          BACKEND_URL="${MEDUSA_BACKEND_URL}"

          echo "Health check URL: ${BACKEND_URL}/health"

          until curl -s -f "${BACKEND_URL}/health" > /dev/null; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "Timed out waiting for backend to become healthy after ${ELAPSED}s."
              echo "Debugging: Attempting verbose curl..."
              curl -v "${BACKEND_URL}/health"
              exit 1
            fi
            echo "Backend not ready yet. Retrying in ${INTERVAL}s... (${ELAPSED}/${TIMEOUT}s elapsed)"
              sleep $INTERVAL
              ELAPSED=$((ELAPSED + INTERVAL))
              done
             echo "Backend is live and healthy!"

  # 3. Trigger Vercel to rebuild and deploy the Next.js storefront
  deploy-storefront-vercel:
    name: Trigger Vercel Storefront Deploy
    needs: deploy-backend-render
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel Deploy Hook
        env:
          VERCEL_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL}}
        run: |
          VERCEL_HOOK="${{ secrets.VERCEL_DEPLOY_HOOK_URL }}"
          if [ -z "$VERCEL_HOOK" ]; then
           echo "Error: VERCEL_DEPLOY_HOOK_URL secret is not set"
           exit 1
          fi
          echo "Triggering Vercel deployment..."
          curl -X POST -f "$VERCEL_HOOK"
          echo "Vercel deployment triggered successfully"

# VERCEL_DEPLOY_HOOK_URL & RENDER_DEPLOY_HOOK_URL
#  These belong exclusively in GitHub Repository Secrets. GitHub Actions injects them safely into your CI/CD workflow at runtime without exposing them in your codebase.
