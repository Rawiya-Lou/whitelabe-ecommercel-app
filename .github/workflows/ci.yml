name: CI & Quality Control

on:
  push:
    branches: [main, feature/*, test/*, develop]
  pull_request:
    branches: [main, master]

# Principle of least privilege for GITHUB_TOKEN
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_ENV_VALIDATION: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  TURBO_TELEMETRY_DISABLED:
    "1"
    # Safe dummy public build values (lets env.mjs & Zod actually run in CI!)
  NEXT_PUBLIC_SITE_URL: "http://127.0.0.1:3000"
  NEXT_PUBLIC_MEDUSA_BACKEND_URL: "http://127.0.0.1:9000"
  NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: "pk_ci_placeholder_key"
  NEXT_PUBLIC_SANITY_PROJECT_ID: "ci-placeholder"
  NEXT_PUBLIC_SANITY_DATASET: "production"
  NEXT_PUBLIC_SANITY_API_VERSION: "2026-05-11"
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: "pk_test_ci_placeholder"
jobs:
  # JOB 1: Detect Changed Files (Path Filtering)

  changes:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      storefront: ${{ steps.filter.outputs.storefront == 'true' }}
      backend: ${{ steps.filter.outputs.backend == 'true' }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Filter Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            storefront:
              - 'apps/storefront/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'eslint.config.ts'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'eslint.config.ts'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'
            cms:
              - 'apps/cms/**'
              - 'package.json'
              - 'package-lock.json'
              - 'turbo.json'
              - 'eslint.config.ts'
              - 'vitest.config.ts'
              - '.github/workflows/ci.yml'

  # JOB 2: Next.js Storefront Verification

  storefront-ci:
    name: Storefront (Next.js) - Quality & Build
    needs: changes
    if: ${{ needs.changes.outputs.storefront == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_ci
        ports:
          - 5432:5432

        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js (Node 24 LTS + NPM Cache)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Restore / Save Turborepo Cache (Storefront)
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-storefront-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-storefront-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            ${{ runner.os }}-turbo-storefront-

      - name: Restore / Save Next.js Build Cache
        uses: actions/cache@v6
        with:
          path: apps/storefront/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('apps/storefront/src/**', 'apps/storefront/app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Typecheck & Lint (Storefront)
        run: npx turbo run typecheck lint --filter=storefront

      - name: Run Storefront Unit & Proxy Tests
        env:
          UPSTASH_REDIS_REST_URL: "https://ci-mock.upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "ci-mock-token"
        run: |
          npx turbo run test:unit --filter=storefront
          npx turbo run test:proxy --filter=storefront

      - name: Build Medusa Backend for Storefront Integration Tests
        env:
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
        run: npx turbo run build --filter=@dtc/backend

      # 2. RUN MEDUSA BACKEND TEMPORARILY WITH NEON SECRETS
      - name: Start Isolated Medusa Backend (Ephemeral Postgres & Redis)
        working-directory: ./apps/backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/medusa_ci"
          REDIS_URL: "redis://127.0.0.1:6379"
          NODE_ENV: test
          JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars"
          COOKIE_SECRET: "ci-cookie-secret-must-be-at-least-32-chars"
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
          SANITY_PROJECT_ID: "ci-placeholder"
          SANITY_DATASET: "production"
          SANITY_API_TOKEN: "ci_mock_sanity_token"
          STRIPE_API_KEY: "sk_test_ci_mock_key"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_mock_secret"
          CHARGILY_SECRET_KEY: "test_sk_ci_mock_key"
          CHARGILY_IS_TEST_MODE: "true"
          LOG_LEVEL: error
        run: |
          npx medusa db:migrate:ci
          npx medusa start > medusa-backend.log 2>&1 &
          npx wait-on http://127.0.0.1:9000/health --timeout 180000
      - name: Check Medusa Backend Logs (if previous step failed)
        if: failure()
        run: cat ./apps/backend/medusa-backend.log || echo "No backend log found"

      - name: Run Storefront Integration Tests (via Turbo)

        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: "http://127.0.0.1:9000"
        run: npx turbo run test:integration --filter=storefront

      - name: Production Build (Storefront — Zero Runtime Secrets)
        run: npx turbo run build --filter=storefront

      - name: Scan Storefront Client Bundle for Leaked Secrets
        run: |
          if grep -rnE "(sk_live_|sk_test_|whsec_|live_sk_|postgres://|postgresql://)" apps/storefront/.next/static; then
            echo "ERROR: Potential secret detected in client static bundle!"
            exit 1
          fi

  # JOB 3: Medusa v2 Backend Verification

  backend-ci:
    name: Backend (Medusa v2) - Quality & Build
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: medusa_backend_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js (Node 24 LTS + NPM Cache)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Backend Dependencies
        run: npm ci

      - name: Restore / Save Turborepo Cache (Backend)
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-backend-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-backend-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            ${{ runner.os }}-turbo-backend-

      - name: Typecheck & Lint (Backend)
        run: npx turbo run typecheck lint --filter=@dtc/backend

      - name: Unit Tests (Vitest)
        env:
          STRIPE_API_KEY: "sk_test_ci_mock_key"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_mock_secret"
          CHARGILY_SECRET_KEY: "test_sk_ci_mock_key"
        run: npx turbo run test --filter=@dtc/backend

      - name: Engine Build (Backend — Zero Runtime Secrets)
        env:
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
        run: npx turbo run build --filter=@dtc/backend

      - name: Run Sanity Synchronization E2E Integration Suite
        working-directory: ./apps/backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/medusa_backend_ci"
          REDIS_URL: "redis://127.0.0.1:6379"
          JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars"
          COOKIE_SECRET: "ci-cookie-secret-must-be-at-least-32-chars"
          SANITY_PROJECT_ID: "ci-placeholder"
          SANITY_DATASET: "production"
          SANITY_API_TOKEN: "ci_mock_sanity_token"
          SANITY_SYNC_SECRET_TOKEN: "ci_mock_sync_secret"
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
          NODE_ENV: test
          STRIPE_API_KEY: "sk_test_ci_mock_key"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_mock_secret"
          CHARGILY_SECRET_KEY: "test_sk_ci_mock_key"
          CHARGILY_IS_TEST_MODE: "true"
          LOG_LEVEL: error
        run: npm run ci:sync:e2e

      - name: Output E2E Backend Logs on Failure
        if: failure()
        run: cat ./apps/backend/medusa-backend.log || echo "No log file found"

      - name: Validate Whitelabel Database Seeding Contracts
        working-directory: ./apps/backend
        env:
          DATABASE_URL: "postgres://postgres:postgres@127.0.0.1:5432/medusa_backend_ci"
          REDIS_URL: "redis://127.0.0.1:6379"
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
          ACTIVE_SHIPPING_PROVIDER: "manual_manual"
          STORE_WAREHOUSE_COUNTRY: "DZ"
          STORE_NAME: "CI Validation Instance"
          STRIPE_API_KEY: "sk_test_ci_mock_key"
          STRIPE_WEBHOOK_SECRET: "whsec_ci_mock_secret"
          CHARGILY_SECRET_KEY: "test_sk_ci_mock_key"
          CHARGILY_IS_TEST_MODE: "true"
          JWT_SECRET: "ci-jwt-secret-must-be-at-least-32-chars"
          COOKIE_SECRET: "ci-cookie-secret-must-be-at-least-32-chars"
        run: |
          npm run predeploy

    # JOB 4: Sanity Studio CMS Verification
  cms-ci:
    name: CMS (Sanity Studio) - Quality & Build
    needs: changes
    if: ${{ needs.changes.outputs.cms == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js (Node 24 LTS + NPM Cache)
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
      - name: Install Dependencies
        run: npm ci

      - name: Restore / Save Turborepo Cache (CMS)
        uses: actions/cache@v6
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-cms-${{ hashFiles('package-lock.json', 'turbo.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-cms-${{ hashFiles('package-lock.json', 'turbo.json') }}-
            ${{ runner.os }}-turbo-cms-

      - name: Typecheck & Lint (CMS)
        run: npx turbo run typecheck lint --filter=cms

      - name: Studio Build
        env:
          SANITY_STUDIO_PROJECT_ID: "ci-placeholder"
          SANITY_STUDIO_DATASET: "production"
        run: npx turbo run build --filter=cms

      - name: Scan CMS Bundle for Leaked Tokens
        run: |
          if grep -rnE "(sk[a-zA-Z0-9]{20,}|SANITY_API_TOKEN|SANITY_API_WRITE_TOKEN)" apps/cms/dist; then
            echo "ERROR: Potential API token leaked into Sanity Studio bundle!"
            exit 1
          fi

  # JOB 4: Security & Vulnerability Audit

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Audit Production Dependencies (High/Critical Fails Build)
        run: npx audit-ci --config ./audit-ci.jsonc
