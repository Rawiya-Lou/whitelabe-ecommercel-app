name: CI & Quality Control

on:
  push:
    branches: [main, feature/*, develop]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  SKIP_ENV_VALIDATION: "true" # Bypasses T3 Env runtime failures during CI builds
  DATABASE_URL: "postgres://postgres:postgres@localhost:5432/ci_test_db"
  JWT_SECRET: "super-secret-ci-jwt-token-string-32-chars-long"
  COOKIE_SECRET: "super-secret-ci-cookie-token-string-32-chars-long"
  NEXT_PUBLIC_MEDUSA_BACKEND_URL: "http://127.0.0.1:9000"
  NEXT_PUBLIC_SANITY_PROJECT_ID: "mockid12"
  NEXT_PUBLIC_SANITY_DATASET: "testdataset"
  NEXT_PUBLIC_STRIPE_KEY: "pk_test_CI_MOCK_KEY_FOR_BUILD_PURPOSES"

jobs:
  # JOB 1: Detect Changed Files (Path Filtering)

  changes:
    name: Detect Changed Applications
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    outputs:
      storefront: ${{ steps.filter.outputs.storefront == 'true' }}
      backend: ${{ steps.filter.outputs.backend == 'true' }}
      cms: ${{ steps.filter.outputs.cms }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Filter Changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            storefront:
              - 'apps/storefront/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'apps/backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            cms:
              - 'apps/cms/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'

  # JOB 2: Next.js Storefront Verification

  storefront-ci:
    name: Storefront (Next.js) - Quality & Build
    needs: changes
    if: ${{ needs.changes.outputs.storefront == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS + NPM Cache)
        uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      # Next.js Build Artifact Caching
      - name: Restore / Save Next.js Build Cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/apps/storefront/.next/cache
          # Generate new cache key whenever source files or dependencies change
          key: ${{ runner.os }}-nextjs-${{ hashFiles('apps/storefront/package-lock.json') }}-${{ hashFiles('apps/storefront/app/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('apps/storefront/package-lock.json') }}-

      - name: Typecheck (TypeScript)
        working-directory: ./apps/storefront

        run: npx turbo run typecheck --filter=storefront

      - name: Lint (ESLint)
        working-directory: ./apps/storefront

        run: npx turbo run lint --filter=storefront
      - name: Run Storefront Unit Tests
        working-directory: ./apps/storefront
        run: npx turbo run test:unit --filter=storefront

      - name: Run Storefront Proxy Tests
        working-directory: ./apps/storefront
        env:
          UPSTASH_REDIS_REST_URL: "https://upstash.io"
          UPSTASH_REDIS_REST_TOKEN: "mock-token"
          NEXT_PUBLIC_SANITY_PROJECT_ID: "mockid12"

        run: npx turbo run test:proxy --filter=storefront

      - name: Build Medusa backend
        working-directory: ./apps/backend
        env:
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
        run: |
          npm run build

      # 2. RUN MEDUSA BACKEND TEMPORARILY WITH NEON SECRETS
      - name: Setup Medusa Database & Start Server
        working-directory: ./apps/backend
        env:
          DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          JWT_SECRET: ${{ env.JWT_SECRET }}
          COOKIE_SECRET: ${{ env.COOKIE_SECRET }}
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
          STRIPE_API_KEY: "sk_test_CI_MOCK_SECRET_KEY"
          STRIPE_WEBHOOK_SECRET: "whsec_CI_MOCK_WEBHOOK_SECRET"
        run: |
          npx medusa db:migrate
          npx medusa start > medusa-backend.log 2>&1 & sleep 10
          npx wait-on http://127.0.0.1/health --timeout 60000

      - name: Check Medusa Backend Logs (if previous step failed)
        if: failure()
        working-directory: ./apps/backend
        run: |
          echo "=== Medusa Backend Logs ==="
          cat medusa-backend.log
      - name: Run Storefront Integration Tests (via Turbo)

        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: "http://127.0.0.1:9000"
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}}
        run: npx turbo run test:integration --filter=storefront

      - name: Production Build
        working-directory: ./apps/storefront
        env:
          NEXT_PUBLIC_MEDUSA_BACKEND_URL: "http://127.0.0.1:9000"
          NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{secrets.NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{secrets.NEXT_PUBLIC_SANITY_PROJECT_ID}}
          NEXT_PUBLIC_SANITY_DATASET: ${{secrets.NEXT_PUBLIC_SANITY_DATASET}}
          UPSTASH_REDIS_REST_URL: ${{secrets.UPSTASH_REDIS_REST_URL}}
          UPSTASH_REDIS_REST_TOKEN: ${{secrets.UPSTASH_REDIS_REST_TOKEN}}
          NEXT_PUBLIC_STRIPE_KEY: ${{ env.NEXT_PUBLIC_STRIPE_KEY }}

        run: npx turbo run build --filter=storefront

  # JOB 3: Medusa v2 Backend Verification

  backend-ci:
    name: Backend (Medusa v2) - Quality & Build
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS + NPM Cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Backend Dependencies
        run: npm ci

      - name: Typecheck
        working-directory: ./apps/backend

        run: npx turbo run typecheck --filter=@dtc/backend

      - name: Unit Tests (Vitest)
        working-directory: ./apps/backend
        env:
          STRIPE_API_KEY: "sk_test_CI_MOCK_KEY"
          STRIPE_WEBHOOK_SECRET: "whsec_CI_MOCK_SECRET"

        run: npx turbo run test --filter=@dtc/backend

      - name: Engine Build
        working-directory: ./apps/backend

        run: npx turbo run build --filter=@dtc/backend

      - name: Run Sanity Synchronization E2E Integration Suite
        working-directory: ./apps/backend
        env:
          DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          COOKIE_SECRET: ${{ secrets.COOKIE_SECRET }}
          SANITY_SYNC_SECRET_TOKEN: ${{ secrets.CI_SYNC_TEST_READ_TOKEN}}
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
          NODE_ENV: test
          STRIPE_API_KEY: "sk_test_CI_MOCK_KEY"
          STRIPE_WEBHOOK_SECRET: "whsec_CI_MOCK_SECRET"
        run: npm run ci:sync:e2e
      - name: Output E2E Backend Logs on Failure
        if: failure()
        
        run: |
          echo "=== Sanity Sync Live E2E Server Log Streams ==="
          cat ./apps/backend/medusa-backend.log || echo "No log file found"   

      - name: Validate Whitelabel Database Seeding Contracts
        working-directory: ./apps/backend
        env:
          DATABASE_URL: ${{ secrets.NEON_CI_DATABASE_URL}}
          MEDUSA_ADMIN_DASHBOARD_DISABLED: "true"
          ACTIVE_SHIPPING_PROVIDER: "manual_manual"
          STORE_WAREHOUSE_COUNTRY: "DZ"
          STORE_NAME: "CI Validation Instance"
          STRIPE_API_KEY: "sk_test_CI_MOCK_KEY"
          STRIPE_WEBHOOK_SECRET: "whsec_CI_MOCK_SECRET"
          CHARGILY_SECRET_KEY: "test_sk_CI_MOCK_KEY"
          CHARGILY_IS_TEST_MODE: "true"
          JWT_SECRET: "super-secret-ci-jwt-token-string-32-chars-long"
          COOKIE_SECRET: "super-secret-ci-cookie-token-string-32-chars-long"
        run: |
          npm run predeploy

  cms-ci:
    name: CMS (Sanity Studio) - Quality & Build
    needs: changes
    if: ${{ needs.changes.outputs.cms == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js (Node 22 LTS + NPM Cache)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - name: Install Dependencies
        run: npm ci

      - name: Typecheck & Validate Studio Schema
        working-directory: ./apps/cms
        run: npx turbo run typecheck --filter=cms

      - name: Studio Build
        working-directory: ./apps/cms
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ secrets.SANITY_STUDIO_PROJECT_ID || '4vzx52ot' }}
          SANITY_STUDIO_DATASET: ${{ secrets.SANITY_STUDIO_DATASET || 'production' }}
        run: npx turbo run build --filter=cms

  # JOB 4: Security & Vulnerability Audit

  security-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit Monorepo Dependencies
        run: npm audit --audit-level=high --omit=dev

        continue-on-error: true
